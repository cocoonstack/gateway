version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /control-plane
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    # CI tests the control-plane web build on the Node LTS line; the image follows it.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
