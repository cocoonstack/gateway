[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "only the gateway writes its sqlite_path and -wal; sqlx-sqlite 0.9.0 caps libsqlite3-sys < 0.38, drop once sqlx releases >= 0.39" },
]

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
